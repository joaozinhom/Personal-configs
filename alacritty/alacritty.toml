# Alacritty Configuration
# Place this at ~/.config/alacritty/alacritty.toml

[general]
import = [
  "~/.config/alacritty/tokyo-night.toml"
]

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[window]
opacity = 0.95
padding.x = 8
padding.y = 8

[window.dimensions]
columns = 120
lines = 36
