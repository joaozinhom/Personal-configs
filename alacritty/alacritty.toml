# Alacritty Configuration
# Self-contained — Synthwave '84 theme + clean styled terminal.

[env]
TERM = "xterm-256color"

# ── Font ──────────────────────────────────────────────
[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# ── Window (clean style) ──────────────────────────────
[window]
opacity = 0.95
padding.x = 10
padding.y = 10
dynamic_padding = true
decorations = "Full"

[window.dimensions]
columns = 120
lines = 36

# ── Cursor ────────────────────────────────────────────
[cursor]
style.shape = "Block"
style.blinking = "On"
blink_interval = 600

# ── Scrolling ─────────────────────────────────────────
[scrolling]
history = 10000

# ── Synthwave '84 colors ──────────────────────────────
[colors.primary]
background = "#262335"
foreground = "#ffffff"

[colors.cursor]
text   = "#262335"
cursor = "#ff7edb"

[colors.selection]
text       = "CellForeground"
background = "#463465"

[colors.normal]
black   = "#241b30"
red     = "#fe4450"
green   = "#72f1b8"
yellow  = "#fe905d"
blue    = "#03edf9"
magenta = "#ff7edb"
cyan    = "#36f9f6"
white   = "#f0eff1"

[colors.bright]
black   = "#495495"
red     = "#fe4450"
green   = "#72f1b8"
yellow  = "#e3ba34"
blue    = "#03edf9"
magenta = "#ff7edb"
cyan    = "#36f9f6"
white   = "#ffffff"

[[colors.indexed_colors]]
index = 16
color = "#f97e72"

[[colors.indexed_colors]]
index = 17
color = "#fe4450"

[keyboard]
bindings = [
  { key = "L", mods = "Command", chars = "\u000c" },
  { key = "L", mods = "Command", action = "ClearHistory" },
]
